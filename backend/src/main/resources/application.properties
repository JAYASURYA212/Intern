# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring Application Name
spring.application.name=mobilemart-backend

# File Upload Settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# H2 Database Settings (Default out-of-the-box database)
spring.datasource.url=jdbc:h2:mem:mobilemartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Access via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret & Expiration
app.jwt.secret=MobileMartSecretKeyForJwtSigningMustBeVeryLongAndSecure1234567890!
app.jwt.expiration-ms=86400000

# File Storage Configuration
app.upload.dir=uploads

# Cloudinary Configuration (Optional)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Shop WhatsApp Configuration
shop.whatsapp.number=${SHOP_WHATSAPP_NUMBER:+919876543210}
shop.phone.number=${SHOP_PHONE_NUMBER:+919876543210}
